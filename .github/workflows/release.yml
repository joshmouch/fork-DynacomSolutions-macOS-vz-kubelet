name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: darwin/arm64 release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and ad-hoc sign
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -ldflags "-X main.buildVersion=${VERSION}" -o dist/MacOSVK ./cmd/virtual-kubelet
          # Same signing as `make build`: ad-hoc with the virtualization entitlement.
          codesign -s - --entitlements resources/vz.entitlements dist/MacOSVK
          codesign -d --entitlements - dist/MacOSVK 2>&1 | grep -q com.apple.security.virtualization
          ASSET="macos-vz-kubelet_${VERSION}_darwin_arm64.tar.gz"
          tar -C dist -czf "dist/${ASSET}" MacOSVK
          (cd dist && shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
          cat "dist/${ASSET}.sha256"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" "dist/${ASSET}" "dist/${ASSET}.sha256" \
            --repo "${GITHUB_REPOSITORY}" --title "${VERSION}" \
            --notes "darwin/arm64 build, ad-hoc signed with the virtualization entitlement. Verify with the .sha256 file."
